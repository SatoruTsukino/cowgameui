<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Cow Game UI Wireframe V4 - Aspect Ratios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e5e7eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        .game-screen {
            background-image: radial-gradient(#d1d5db 2px, transparent 2px);
            background-size: 32px 32px;
            background-position: center;
            background-color: #f3f4f6;
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.15);
            max-width: 90vw;
            max-height: 75vh;
            margin: 0 auto;
        }

        .ui-element {
            user-select: none;
            -webkit-user-select: none;
        }

        .hud-spring {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Specialized Shapes */
        .shape-leaf {
            border-radius: 2rem 2rem 0.5rem 0.5rem;
            border-top-left-radius: 2.5rem;
            border-bottom-right-radius: 2.5rem;
            border-top-right-radius: 0.5rem;
            border-bottom-left-radius: 0.5rem;
        }

        .shape-leaf-inner {
            border-top-left-radius: 1.875rem;
            border-bottom-right-radius: 1.875rem;
            border-top-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .shape-cowbell {
            border-radius: 35% 35% 15% 15% / 50% 50% 20% 20%;
        }

        .aspect-21-9 { aspect-ratio: 21 / 9; }
        .aspect-4-3 { aspect-ratio: 4 / 3; }
        .aspect-19-5-9 { aspect-ratio: 19.5 / 9; }

        /* Dynamic Theme System */
        :root {
            --theme-screen-bg: #f3f4f6;
            --theme-grid-dot: #d1d5db;
            --theme-card-bg: #ffffff;
            --theme-card-subtle: #f3f4f6;
            --theme-border: #9ca3af;
            --theme-border-dark: #6b7280;
            --theme-border-darker: #4b5563;
            --theme-fill-primary: #d1d5db;
            --theme-fill-subtle: #e5e7eb;
            --theme-accent: #6b7280;
            --theme-accent-light: #9ca3af;
            --theme-accent-dark: #4b5563;
            --theme-text-main: #6b7280;
            --theme-text-dark: #4b5563;
            --theme-text-muted: #9ca3af;
        }

        .game-screen {
            background-color: var(--theme-screen-bg) !important;
            background-image: radial-gradient(var(--theme-grid-dot) 2px, transparent 2px) !important;
            transition: background-color 0.25s ease;
        }

        .game-screen .bg-white { background-color: var(--theme-card-bg) !important; }
        .game-screen .bg-gray-100 { background-color: var(--theme-card-subtle) !important; }
        .game-screen .bg-gray-200 { background-color: var(--theme-fill-subtle) !important; }
        .game-screen .bg-gray-300 { background-color: var(--theme-fill-primary) !important; }
        .game-screen .bg-gray-400 { background-color: var(--theme-accent-light) !important; }
        .game-screen .bg-gray-500 { background-color: var(--theme-accent) !important; }
        .game-screen .bg-gray-600 { background-color: var(--theme-accent-dark) !important; }

        .game-screen .border-gray-300 { border-color: var(--theme-fill-primary) !important; }
        .game-screen .border-gray-400 { border-color: var(--theme-border) !important; }
        .game-screen .border-gray-500 { border-color: var(--theme-border-dark) !important; }
        .game-screen .border-gray-600 { border-color: var(--theme-border-darker) !important; }

        .game-screen .text-gray-400 { color: var(--theme-text-muted) !important; }
        .game-screen .text-gray-500 { color: var(--theme-text-main) !important; }
        .game-screen .text-gray-600 { color: var(--theme-text-dark) !important; }

        .game-screen .stroke-gray-500 { stroke: var(--theme-text-main) !important; }
        .game-screen .stroke-gray-400 { stroke: var(--theme-text-muted) !important; }
    </style>
</head>
<body class="gap-6 w-full">

    <!-- ================= CONTROLS ================= -->
    <div class="flex flex-col gap-3 w-full max-w-[1280px] px-6 py-4 bg-white rounded-[2rem] border-[6px] border-gray-400 shadow-sm z-50">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="w-4 h-4 rounded-full bg-gray-500 animate-pulse"></span>
                <span class="text-gray-500 font-black text-sm tracking-widest uppercase">ScreenGui Controls</span>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <select id="aspectRatioSelect" onchange="changeAspectRatio(this)" class="px-4 py-2 rounded-full border-[4px] border-gray-400 bg-white text-gray-600 font-black text-xs tracking-wider uppercase outline-none cursor-pointer hover:bg-gray-50">
                    <option value="aspect-video">Desktop (16:9)</option>
                    <option value="aspect-21-9">Ultrawide (21:9)</option>
                    <option value="aspect-19-5-9">Mobile (19.5:9)</option>
                    <option value="aspect-4-3">Tablet (4:3)</option>
                </select>
                <div class="w-px h-6 bg-gray-300 mx-1"></div>
                <button id="btnCompact" onclick="toggleCompactMode()" class="px-5 py-2.5 rounded-full border-[4px] border-gray-400 bg-gray-100 text-gray-600 font-black text-xs tracking-wider uppercase hover:bg-gray-200 transition-colors">
                    Compact Mode: OFF
                </button>
                <button id="btnBulletin" onclick="toggleBulletin()" class="px-5 py-2.5 rounded-full border-[4px] border-gray-600 bg-gray-600 text-white font-black text-xs tracking-wider uppercase hover:opacity-90 transition-opacity">
                    World Bulletin: ON
                </button>
                <button id="btnSafeZones" onclick="toggleSafeZones()" class="px-5 py-2.5 rounded-full border-[4px] border-gray-400 bg-gray-100 text-gray-600 font-black text-xs tracking-wider uppercase hover:bg-gray-200 transition-colors">
                    Mobile Safe Zones: OFF
                </button>
                <button id="btnCoreGui" onclick="toggleCoreGui()" class="px-5 py-2.5 rounded-full border-[4px] border-gray-400 bg-gray-100 text-gray-600 font-black text-xs tracking-wider uppercase hover:bg-gray-200 transition-colors">
                    Roblox CoreGui: OFF
                </button>
                <button id="btnTheme" onclick="toggleThemeDrawer()" class="px-5 py-2.5 rounded-full border-[4px] border-gray-400 bg-gray-100 text-gray-600 font-black text-xs tracking-wider uppercase hover:bg-gray-200 transition-colors">
                    Theme / Colors: OFF
                </button>
            </div>
        </div>

        <!-- EXPANDABLE THEME & COLOR PICKER DRAWER -->
        <div id="themeDrawer" class="hidden w-full pt-3 mt-1 border-t-4 border-gray-200 flex flex-col gap-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <!-- Preset buttons -->
                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-gray-400 font-black text-xs tracking-wider uppercase mr-1">Palettes:</span>
                    <button onclick="applyThemePreset('monochrome')" class="px-3.5 py-1.5 rounded-full border-2 border-gray-400 bg-gray-100 text-gray-700 font-black text-[11px] tracking-wider uppercase hover:bg-gray-200">Default Mono</button>
                    <button onclick="applyThemePreset('meadow')" class="px-3.5 py-1.5 rounded-full border-2 border-green-500 bg-green-50 text-green-700 font-black text-[11px] tracking-wider uppercase hover:bg-green-100">Cozy Meadow</button>
                    <button onclick="applyThemePreset('sunrise')" class="px-3.5 py-1.5 rounded-full border-2 border-amber-500 bg-amber-50 text-amber-700 font-black text-[11px] tracking-wider uppercase hover:bg-amber-100">Golden Sunrise</button>
                    <button onclick="applyThemePreset('lavender')" class="px-3.5 py-1.5 rounded-full border-2 border-purple-500 bg-purple-50 text-purple-700 font-black text-[11px] tracking-wider uppercase hover:bg-purple-100">Lavender Dusk</button>
                    <button onclick="applyThemePreset('sky')" class="px-3.5 py-1.5 rounded-full border-2 border-sky-500 bg-sky-50 text-sky-700 font-black text-[11px] tracking-wider uppercase hover:bg-sky-100">Sky Pasture</button>
                </div>

                <!-- Reset Button -->
                <button onclick="resetTheme()" class="px-3.5 py-1.5 rounded-full border-2 border-red-300 bg-red-50 text-red-600 font-black text-[11px] tracking-wider uppercase hover:bg-red-100">
                    Reset to Wireframe
                </button>
            </div>

            <!-- Live Element Color Pickers -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 pt-1">
                <label class="flex items-center gap-2 bg-gray-50 border-2 border-gray-300 rounded-xl px-2.5 py-1.5 cursor-pointer hover:border-gray-400">
                    <input type="color" id="pickerCard" value="#ffffff" oninput="updateThemeProp('--theme-card-bg', this.value)" class="w-7 h-7 rounded-lg border-none cursor-pointer bg-transparent">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-gray-400 uppercase leading-none">Part</span>
                        <span class="text-[11px] font-black text-gray-700 uppercase">Cards</span>
                    </div>
                </label>
                <label class="flex items-center gap-2 bg-gray-50 border-2 border-gray-300 rounded-xl px-2.5 py-1.5 cursor-pointer hover:border-gray-400">
                    <input type="color" id="pickerBorder" value="#9ca3af" oninput="updateThemeProp('--theme-border', this.value)" class="w-7 h-7 rounded-lg border-none cursor-pointer bg-transparent">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-gray-400 uppercase leading-none">Part</span>
                        <span class="text-[11px] font-black text-gray-700 uppercase">Borders</span>
                    </div>
                </label>
                <label class="flex items-center gap-2 bg-gray-50 border-2 border-gray-300 rounded-xl px-2.5 py-1.5 cursor-pointer hover:border-gray-400">
                    <input type="color" id="pickerFill" value="#d1d5db" oninput="updateThemeProp('--theme-fill-primary', this.value)" class="w-7 h-7 rounded-lg border-none cursor-pointer bg-transparent">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-gray-400 uppercase leading-none">Part</span>
                        <span class="text-[11px] font-black text-gray-700 uppercase">Fills</span>
                    </div>
                </label>
                <label class="flex items-center gap-2 bg-gray-50 border-2 border-gray-300 rounded-xl px-2.5 py-1.5 cursor-pointer hover:border-gray-400">
                    <input type="color" id="pickerAccent" value="#4b5563" oninput="updateThemeProp('--theme-accent', this.value)" class="w-7 h-7 rounded-lg border-none cursor-pointer bg-transparent">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-gray-400 uppercase leading-none">Part</span>
                        <span class="text-[11px] font-black text-gray-700 uppercase">Accents</span>
                    </div>
                </label>
                <label class="flex items-center gap-2 bg-gray-50 border-2 border-gray-300 rounded-xl px-2.5 py-1.5 cursor-pointer hover:border-gray-400">
                    <input type="color" id="pickerText" value="#4b5563" oninput="updateThemeProp('--theme-text-main', this.value)" class="w-7 h-7 rounded-lg border-none cursor-pointer bg-transparent">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-gray-400 uppercase leading-none">Part</span>
                        <span class="text-[11px] font-black text-gray-700 uppercase">Text</span>
                    </div>
                </label>
                <label class="flex items-center gap-2 bg-gray-50 border-2 border-gray-300 rounded-xl px-2.5 py-1.5 cursor-pointer hover:border-gray-400">
                    <input type="color" id="pickerCanvas" value="#f3f4f6" oninput="updateThemeProp('--theme-screen-bg', this.value)" class="w-7 h-7 rounded-lg border-none cursor-pointer bg-transparent">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-gray-400 uppercase leading-none">Part</span>
                        <span class="text-[11px] font-black text-gray-700 uppercase">Canvas</span>
                    </div>
                </label>
            </div>
        </div>
    </div>

    <!-- ================= GAME PREVIEW ================= -->
    <div class="game-screen w-[1280px] aspect-video relative rounded-[3rem] border-[8px] border-gray-500 overflow-hidden transition-all duration-500">
        
        <!-- GAME UI SCALER WRAPPER -->
        <div id="ui-container" class="absolute pointer-events-none origin-top-left">
            
            <!-- ROBLOX COREGUI OVERLAY (TOP BAR MOCKUP - LEFT UNIBAR ONLY) -->
            <div id="robloxCoreGui" class="hidden absolute top-4 left-6 pointer-events-none z-30 opacity-90 transition-opacity">
                <!-- Top-Left Unibar: Roblox Icon + Hamburger + Chat -->
                <div class="flex items-center gap-1.5 bg-black/75 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 shadow-lg text-white pointer-events-auto">
                    <!-- Roblox Hexagon -->
                    <div class="w-6 h-6 flex items-center justify-center font-black text-xs">
                        <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24">
                            <path d="M5.2 2L2 18.8 18.8 22l3.2-16.8L5.2 2zm10.1 11.5l-4.5 1-1-4.5 4.5-1 1 4.5z"/>
                        </svg>
                    </div>
                    <div class="w-px h-3.5 bg-white/20"></div>
                    <!-- Menu / 3 lines -->
                    <div class="w-6 h-6 flex items-center justify-center cursor-pointer hover:opacity-80">
                        <svg class="w-3.5 h-3.5 stroke-white stroke-2" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </div>
                    <div class="w-px h-3.5 bg-white/20"></div>
                    <!-- Chat with badge -->
                    <div class="relative w-6 h-6 flex items-center justify-center cursor-pointer hover:opacity-80">
                        <svg class="w-3.5 h-3.5 stroke-white stroke-2" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[8px] font-black rounded-full px-1">3</span>
                    </div>
                </div>
            </div>

            <!-- 1. TOP-LEFT: Vitals & Quests (Safe below Unibar) -->
            <div id="topLeftVitals" class="absolute top-8 left-8 flex items-start gap-4 pointer-events-auto shrink-0 z-20 hud-spring">
                <!-- Cow Profile -->
                <div class="relative w-28 h-28 rounded-[2rem] border-[6px] border-gray-400 bg-white flex flex-col items-center justify-center shadow-md ui-element hover:scale-105 transition-transform cursor-pointer shrink-0">
                    <span class="text-gray-500 font-black text-lg tracking-widest">COW</span>
                    
                    <div id="profileHerdBadge" class="hidden absolute -top-3 -right-3 px-3 py-1 bg-gray-600 text-white rounded-full border-[4px] border-white shadow-sm">
                        <span class="font-black text-[10px] tracking-widest uppercase">+ HERD</span>
                    </div>

                    <div class="absolute -bottom-3.5 left-1/2 -translate-x-1/2 px-3 py-1 bg-gray-400 rounded-xl border-[4px] border-white flex items-center shadow-sm whitespace-nowrap">
                        <span class="text-white font-black text-[10px] tracking-wider uppercase">Rebirth 2</span>
                    </div>
                </div>

                <!-- Inline Vitals -->
                <div class="flex flex-col gap-3 w-64 pt-1 ui-element">
                    <div class="flex flex-col gap-1">
                        <span class="px-1 text-gray-500 font-black text-[10px] tracking-widest uppercase truncate">Grazing: Clover Meadow</span>
                        <div class="w-full h-10 shape-leaf border-[6px] border-gray-400 bg-white p-1 flex items-center shadow-sm relative overflow-hidden">
                            <div class="h-full w-[68%] bg-gray-300 shape-leaf-inner rounded-r-sm"></div>
                            <div class="absolute inset-0 flex items-center px-3 pointer-events-none">
                                <span class="text-gray-600 font-black text-xs tracking-wider">68%</span>
                            </div>
                        </div>
                    </div>

                    <div class="w-full rounded-full border-[6px] border-gray-500 bg-white p-1 shadow-sm relative h-10" title="Outer Border = Stamina">
                        <div class="h-full w-[85%] bg-gray-300 rounded-full flex items-center px-2">
                            <span class="text-gray-600 font-black text-[10px] tracking-wider uppercase">HP 100</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. TOP-RIGHT: Economy & Menus (Elevated to top-4) -->
            <div id="topRightHud" class="absolute top-4 right-8 flex items-start gap-4 pointer-events-auto shrink-0 z-20 hud-spring">
                <div class="flex flex-col items-center">
                    <div class="h-14 px-5 rounded-[1.5rem] border-[6px] border-gray-400 bg-white flex items-center justify-center shadow-sm relative z-10 ui-element hover:scale-105 transition-transform cursor-pointer">
                        <span class="text-gray-500 font-black tracking-widest text-xs uppercase">Calories: 1,500</span>
                    </div>
                    <div id="upgradesPill" class="h-8 px-4 -mt-2 rounded-b-xl border-[4px] border-gray-400 border-t-0 bg-gray-200 flex items-end pb-1 shadow-sm hover:bg-gray-300 cursor-pointer transition-colors">
                        <span class="text-gray-500 font-black text-[9px] tracking-widest uppercase">Upgrades ⬆</span>
                    </div>
                </div>

                <div id="topRightStandard" class="flex items-start gap-3 pt-1">
                    <div class="w-14 h-14 shape-cowbell border-[6px] border-gray-400 bg-white flex items-center justify-center shadow-sm ui-element hover:scale-110 cursor-pointer relative" title="Settings">
                        <span class="text-gray-500 font-black text-[9px] tracking-widest uppercase mt-2">SET</span>
                        <div class="absolute -top-2 w-4 h-3 border-[4px] border-gray-400 rounded-t-full bg-transparent"></div>
                    </div>
                </div>

                <div id="topRightCompact" class="hidden w-14 h-14 rounded-2xl border-[6px] border-gray-400 bg-white flex flex-col items-center justify-center shadow-sm ui-element hover:scale-110 cursor-pointer pt-1" title="Menu (Settings, Herd, Trade)">
                    <span class="text-gray-600 font-black text-sm tracking-widest leading-none">•••</span>
                </div>
            </div>

            <!-- 2. TOP-CENTER: Town Bulletin (Elevated to top-4) -->
            <div id="townBulletinWrapper" class="absolute top-4 left-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-auto ui-element hud-spring z-20">
                <div id="bulletinFull" class="flex flex-col items-center">
                    <div class="flex items-center gap-3 px-4 py-2.5 rounded-[2rem] border-[6px] border-gray-400 bg-white shadow-lg">
                        <div class="flex items-center gap-2 pr-3 border-r-4 border-gray-200">
                            <div class="w-8 h-8 rounded-full border-4 border-gray-400 bg-gray-100 flex items-center justify-center">
                                <svg class="w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="4"></circle>
                                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                                </svg>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-[9px] font-black text-gray-400 tracking-widest uppercase leading-none">Cycle</span>
                                <span class="text-xs font-black text-gray-600 tracking-wider uppercase mt-0.5">DAY • 02:45</span>
                            </div>
                        </div>

                        <div class="flex flex-col gap-1 min-w-[155px]">
                            <div class="flex items-center justify-between px-1">
                                <span class="text-[9px] font-black text-gray-400 tracking-widest uppercase">World Event</span>
                                <span class="text-[10px] font-black text-gray-500 tracking-wider">4m 12s</span>
                            </div>
                            <div class="w-full h-6 rounded-full border-4 border-gray-300 bg-gray-100 p-0.5 relative overflow-hidden flex items-center">
                                <div class="h-full w-[55%] bg-gray-300 rounded-full"></div>
                                <span class="absolute inset-0 flex items-center justify-center text-[10px] font-black text-gray-600 tracking-wider uppercase">
                                    Clover Bloom
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="-mt-1.5 px-4 py-1 rounded-b-2xl rounded-t-lg border-4 border-gray-500 bg-gray-100 shadow-md flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-gray-500"></span>
                        <span class="text-[10px] font-black text-gray-600 tracking-widest uppercase">2x Calories • 01:30</span>
                    </div>
                </div>

                <div id="bulletinCompact" class="hidden relative items-center gap-2.5 px-4 py-2.5 rounded-full border-[6px] border-gray-400 bg-white shadow-lg cursor-pointer hover:scale-105 transition-transform">
                    <div class="w-7 h-7 rounded-full border-4 border-gray-400 bg-gray-100 flex items-center justify-center">
                        <svg class="w-3.5 h-3.5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                        </svg>
                    </div>
                    <span class="text-xs font-black text-gray-600 tracking-wider uppercase">02:45</span>
                    <span class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-gray-500 border-4 border-white shadow-sm"></span>
                </div>
            </div>

            <!-- ================= SIDEBARS ================= -->
            <div id="leftSidebar" class="absolute left-8 top-48 flex flex-col gap-4 pointer-events-auto z-10">
                <div id="leftSidebarStandard" class="flex flex-col gap-4">
                    <div class="w-16 h-[4.5rem] rounded-xl border-[6px] border-gray-400 bg-white relative shadow-sm ui-element hover:scale-110 cursor-pointer flex flex-col items-center justify-end pb-1.5" title="Inventory">
                        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-4 border-b-[4px] border-l-[4px] border-r-[4px] border-gray-400 rounded-b-md bg-gray-100"></div>
                        <span class="text-gray-500 font-black text-[9px] tracking-widest uppercase">INV</span>
                    </div>
                    <div class="w-16 h-16 rounded-2xl border-[6px] border-gray-400 bg-white flex items-center justify-center shadow-sm ui-element hover:scale-110 cursor-pointer" title="Closet">
                        <span class="text-gray-500 font-black text-[9px] tracking-wider uppercase">Closet</span>
                    </div>
                </div>

                <div id="leftSidebarCompact" class="hidden w-16 h-[4.5rem] rounded-xl border-[6px] border-gray-400 bg-white shadow-sm ui-element hover:scale-110 cursor-pointer flex flex-col items-center justify-end pb-1.5 relative" title="Bag (Inv + Closet)">
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-4 border-b-[4px] border-l-[4px] border-r-[4px] border-gray-400 rounded-b-md bg-gray-100"></div>
                    <span class="text-gray-500 font-black text-[9px] tracking-wider uppercase">BAG</span>
                </div>
            </div>

            <div id="rightSidebar" class="absolute right-8 top-32 flex flex-col items-end gap-4 pointer-events-auto z-10 hud-spring">
                <!-- Herd Button -->
                <div class="relative w-16 h-16 ui-element hover:scale-110 cursor-pointer" title="Herd">
                    <div class="absolute top-0 right-0 w-12 h-12 rounded-[0.8rem] border-[6px] border-gray-400 bg-gray-200"></div>
                    <div class="absolute bottom-0 left-0 w-12 h-12 rounded-[0.8rem] border-[6px] border-gray-400 bg-white flex items-center justify-center shadow-sm">
                        <span class="text-gray-500 font-black text-[9px] tracking-widest uppercase">Herd</span>
                    </div>
                </div>
                <!-- Trade Button -->
                <div class="w-16 h-16 rounded-2xl border-[6px] border-gray-400 bg-white flex items-center justify-center shadow-sm ui-element hover:scale-110 cursor-pointer" title="Trade">
                    <span class="text-gray-500 font-black text-[10px] tracking-wider uppercase">Trade</span>
                </div>
            </div>

            <!-- ================= BOTTOM SAFE ZONES & MOBILE ACTION CLUSTER ================= -->
            <div id="safeZoneLeft" class="hidden absolute bottom-8 left-8 w-48 h-48 rounded-full border-[4px] border-dashed border-gray-400/50 bg-gray-300/20 flex flex-col items-center justify-center pointer-events-none">
                <div class="w-20 h-20 rounded-full border-[5px] border-gray-400 bg-white/70 flex items-center justify-center shadow-inner">
                    <div class="w-8 h-8 rounded-full bg-gray-400"></div>
                </div>
                <span class="text-gray-500 font-black text-[9px] tracking-widest uppercase mt-2">Thumbstick</span>
            </div>

            <div id="safeZoneRight" class="hidden absolute bottom-8 right-8 w-60 h-60 pointer-events-auto">
                <!-- Safe zone background ring -->
                <div class="absolute inset-0 rounded-[3rem] border-[4px] border-dashed border-gray-400/30 bg-gray-300/10 pointer-events-none -z-10"></div>
                
                <!-- Anchor: Jump Button (Bottom-Right) -->
                <div id="btnMobileJump" class="absolute bottom-2 right-2 w-20 h-20 rounded-full border-[6px] border-gray-400 bg-white flex flex-col items-center justify-center shadow-md ui-element hover:scale-105 active:scale-95 cursor-pointer transition-transform" title="Jump">
                    <svg class="w-8 h-8 stroke-gray-500 stroke-[3.5] fill-none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/>
                    </svg>
                    <span class="text-gray-500 font-black text-[8px] tracking-wider uppercase -mt-0.5">JUMP</span>
                </div>

                <!-- Radial Arc Satellite Buttons (Bottom to Top: Sprint -> Moo -> Emote) -->
                <!-- 1. Sprint (Bottom / West, θ ≈ 180°) -->
                <div id="btnMobileSprint" class="absolute bottom-[24px] right-[106px] w-12 h-12 rounded-full border-[5px] border-gray-400 bg-white flex flex-col items-center justify-center shadow-sm ui-element hover:scale-110 active:scale-95 cursor-pointer transition-transform" title="Sprint">
                    <svg class="w-5 h-5 stroke-gray-500 stroke-2 fill-none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                    <span class="text-gray-500 font-black text-[7px] tracking-wider uppercase -mt-0.5">SPRINT</span>
                </div>

                <!-- 2. Moo (Middle / North-West, θ ≈ 135°) -->
                <div id="btnMobileMoo" class="absolute bottom-[82px] right-[82px] w-12 h-12 rounded-full border-[5px] border-gray-400 bg-white flex flex-col items-center justify-center shadow-sm ui-element hover:scale-110 active:scale-95 cursor-pointer transition-transform" title="Moo">
                    <svg class="w-5 h-5 stroke-gray-500 stroke-2 fill-none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M16 12h.01M9 16c1.5 1 4.5 1 6 0M4 9a8 8 0 1 1 16 0c0 5-4 8-8 8s-8-3-8-8z"/>
                    </svg>
                    <span class="text-gray-500 font-black text-[7px] tracking-wider uppercase -mt-0.5">MOO</span>
                </div>

                <!-- 3. Emote (Top / North, θ ≈ 90°) -->
                <div id="btnMobileEmote" class="absolute bottom-[106px] right-[24px] w-12 h-12 rounded-full border-[5px] border-gray-400 bg-white flex flex-col items-center justify-center shadow-sm ui-element hover:scale-110 active:scale-95 cursor-pointer transition-transform" title="Emote">
                    <svg class="w-5 h-5 stroke-gray-500 stroke-2 fill-none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="text-gray-500 font-black text-[7px] tracking-wider uppercase -mt-0.5">EMOTE</span>
                </div>
            </div>

            <!-- ================= BOTTOM-CENTER AREA ACTIONS ================= -->
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 pointer-events-auto w-1/3 max-w-sm z-10">
                <div class="flex flex-col items-center justify-center py-3 px-5 rounded-3xl border-[6px] border-dashed border-gray-400 bg-white/80 backdrop-blur-sm shadow-sm ui-element hover:scale-105 cursor-pointer">
                    <span class="text-gray-500 font-black text-sm tracking-widest uppercase">Area Actions (WIP)</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        let isCompact = false;
        let isBulletinVisible = true;
        let areSafeZonesVisible = false;
        let isCoreGuiVisible = false;
        let isThemeDrawerOpen = false;

        const THEME_PRESETS = {
            monochrome: {
                '--theme-card-bg': '#ffffff',
                '--theme-border': '#9ca3af',
                '--theme-fill-primary': '#d1d5db',
                '--theme-accent': '#6b7280',
                '--theme-text-main': '#6b7280',
                '--theme-screen-bg': '#f3f4f6'
            },
            meadow: {
                '--theme-card-bg': '#f7fdf9',
                '--theme-border': '#4ade80',
                '--theme-fill-primary': '#86efac',
                '--theme-accent': '#16a34a',
                '--theme-text-main': '#166534',
                '--theme-screen-bg': '#ecfdf5'
            },
            sunrise: {
                '--theme-card-bg': '#fffdf5',
                '--theme-border': '#f59e0b',
                '--theme-fill-primary': '#fde68a',
                '--theme-accent': '#d97706',
                '--theme-text-main': '#78350f',
                '--theme-screen-bg': '#fef3c7'
            },
            lavender: {
                '--theme-card-bg': '#faf5ff',
                '--theme-border': '#c084fc',
                '--theme-fill-primary': '#e9d5ff',
                '--theme-accent': '#9333ea',
                '--theme-text-main': '#581c87',
                '--theme-screen-bg': '#f3e8ff'
            },
            sky: {
                '--theme-card-bg': '#f0f9ff',
                '--theme-border': '#38bdf8',
                '--theme-fill-primary': '#bae6fd',
                '--theme-accent': '#0284c7',
                '--theme-text-main': '#075985',
                '--theme-screen-bg': '#e0f2fe'
            }
        };

        function updateThemeProp(prop, val) {
            const screen = document.querySelector('.game-screen');
            screen.style.setProperty(prop, val);

            if (prop === '--theme-border') {
                screen.style.setProperty('--theme-border-dark', val);
                screen.style.setProperty('--theme-border-darker', val);
            }
            if (prop === '--theme-text-main') {
                screen.style.setProperty('--theme-text-dark', val);
                screen.style.setProperty('--theme-text-muted', val);
            }
            if (prop === '--theme-accent') {
                screen.style.setProperty('--theme-accent-light', val);
                screen.style.setProperty('--theme-accent-dark', val);
            }
            if (prop === '--theme-screen-bg') {
                screen.style.setProperty('--theme-grid-dot', val);
            }
        }

        function applyThemePreset(presetKey) {
            const preset = THEME_PRESETS[presetKey];
            if (!preset) return;

            for (const [prop, val] of Object.entries(preset)) {
                updateThemeProp(prop, val);
            }

            document.getElementById('pickerCard').value = preset['--theme-card-bg'];
            document.getElementById('pickerBorder').value = preset['--theme-border'];
            document.getElementById('pickerFill').value = preset['--theme-fill-primary'];
            document.getElementById('pickerAccent').value = preset['--theme-accent'];
            document.getElementById('pickerText').value = preset['--theme-text-main'];
            document.getElementById('pickerCanvas').value = preset['--theme-screen-bg'];
        }

        function resetTheme() {
            applyThemePreset('monochrome');
        }

        function toggleThemeDrawer() {
            isThemeDrawerOpen = !isThemeDrawerOpen;
            const drawer = document.getElementById('themeDrawer');
            drawer.classList.toggle('hidden', !isThemeDrawerOpen);
            setButtonState(document.getElementById('btnTheme'), 'Theme / Colors', isThemeDrawerOpen);
        }

        function setButtonState(btn, label, active) {
            btn.textContent = `${label}: ${active ? 'ON' : 'OFF'}`;
            if (active) {
                btn.className = "px-5 py-2.5 rounded-full border-[4px] border-gray-600 bg-gray-600 text-white font-black text-xs tracking-wider uppercase hover:opacity-90 transition-opacity";
            } else {
                btn.className = "px-5 py-2.5 rounded-full border-[4px] border-gray-400 bg-gray-100 text-gray-600 font-black text-xs tracking-wider uppercase hover:bg-gray-200 transition-colors";
            }
        }

        function toggleCompactMode() {
            isCompact = !isCompact;
            setButtonState(document.getElementById('btnCompact'), 'Compact Mode', isCompact);

            document.getElementById('profileHerdBadge').classList.toggle('hidden', !isCompact);
            document.getElementById('leftSidebarStandard').classList.toggle('hidden', isCompact);
            document.getElementById('leftSidebarCompact').classList.toggle('hidden', !isCompact);
            document.getElementById('leftSidebarCompact').classList.toggle('flex', isCompact);

            document.getElementById('rightSidebar').classList.toggle('hidden', isCompact);

            document.getElementById('topRightStandard').classList.toggle('hidden', isCompact);
            document.getElementById('topRightCompact').classList.toggle('hidden', !isCompact);
            document.getElementById('topRightCompact').classList.toggle('flex', isCompact);
            
            const upgradesPill = document.getElementById('upgradesPill');
            if (isCompact) {
                upgradesPill.classList.add('hidden');
            } else {
                upgradesPill.classList.remove('hidden');
            }

            document.getElementById('bulletinFull').classList.toggle('hidden', isCompact);
            document.getElementById('bulletinCompact').classList.toggle('hidden', !isCompact);
            document.getElementById('bulletinCompact').classList.toggle('flex', isCompact);
        }

        function toggleBulletin() {
            isBulletinVisible = !isBulletinVisible;
            setButtonState(document.getElementById('btnBulletin'), 'World Bulletin', isBulletinVisible);
            const bulletin = document.getElementById('townBulletinWrapper');
            if (isBulletinVisible) {
                bulletin.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
            } else {
                bulletin.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
            }
        }

        function toggleSafeZones() {
            areSafeZonesVisible = !areSafeZonesVisible;
            setButtonState(document.getElementById('btnSafeZones'), 'Mobile Safe Zones', areSafeZonesVisible);
            document.getElementById('safeZoneLeft').classList.toggle('hidden', !areSafeZonesVisible);
            document.getElementById('safeZoneRight').classList.toggle('hidden', !areSafeZonesVisible);
        }

        function toggleCoreGui() {
            isCoreGuiVisible = !isCoreGuiVisible;
            setButtonState(document.getElementById('btnCoreGui'), 'Roblox CoreGui', isCoreGuiVisible);
            const coreGui = document.getElementById('robloxCoreGui');
            coreGui.classList.toggle('hidden', !isCoreGuiVisible);

            const vitals = document.getElementById('topLeftVitals');
            if (isCoreGuiVisible) {
                vitals.classList.remove('top-8');
                vitals.classList.add('top-16');
            } else {
                vitals.classList.add('top-8');
                vitals.classList.remove('top-16');
            }
        }

        function changeAspectRatio(selectElement) {
            const screen = document.querySelector('.game-screen');
            screen.classList.remove('aspect-video', 'aspect-21-9', 'aspect-4-3', 'aspect-19-5-9');
            screen.classList.add(selectElement.value);
            let count = 0;
            const timer = setInterval(() => {
                resizeUI();
                count++;
                if (count > 25) clearInterval(timer);
            }, 20);
        }

        function resizeUI() {
            const screen = document.querySelector('.game-screen');
            const ui = document.getElementById('ui-container');
            if (!screen || !ui) return;
            
            const clientW = screen.clientWidth;
            const clientH = screen.clientHeight;
            if (clientW === 0 || clientH === 0) return;

            const virtualHeight = 720;
            const currentAspectRatio = clientW / clientH;
            const virtualWidth = virtualHeight * currentAspectRatio;
            
            ui.style.width = `${virtualWidth}px`;
            ui.style.height = `${virtualHeight}px`;
            
            const scale = clientH / virtualHeight;
            ui.style.transform = `scale(${scale})`;
            ui.style.left = `0px`;
            ui.style.top = `0px`;
        }

        const resizeObserver = new ResizeObserver(() => { resizeUI(); });

        document.addEventListener('DOMContentLoaded', () => {
            const screen = document.querySelector('.game-screen');
            resizeObserver.observe(screen);
            resizeUI();

            const params = new URLSearchParams(window.location.search);
            if (params.get('safezones') === '1') toggleSafeZones();
            if (params.get('coregui') === '1') toggleCoreGui();
            if (params.get('compact') === '1') toggleCompactMode();
            if (params.get('theme')) {
                toggleThemeDrawer();
                applyThemePreset(params.get('theme'));
            }
        });
    </script>
</body>
</html>
